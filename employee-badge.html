<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>บัตรพนักงาน — CHIT WAI PHYO</title>
    <style>
      :root {
        --blue: #3157a4;
        --sky: #29a9e1;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #ece7df;
        font-family: "Segoe UI", Tahoma, sans-serif;
      }
      .card {
        width: 320px;
        height: 510px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 18px 40px -14px rgba(0, 0, 0, 0.35);
      }
      .photo {
        position: relative;
        height: 58%;
        flex-shrink: 0;
        background: var(--sky);
      }
      .photo::before {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0.25;
        background-image: repeating-linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.5) 0 2px,
          transparent 2px 22px
        );
      }
      .brand {
        position: absolute;
        inset: 0 auto 0 0;
        width: 30%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--blue);
        border-bottom-right-radius: 28px;
        z-index: 1;
      }
      .brand span {
        writing-mode: vertical-rl;
        transform: rotate(180deg);
        color: #fff;
        font-size: 60px;
        font-weight: 900;
        letter-spacing: 0.25em;
        line-height: 1;
      }
      .photo img {
        position: absolute;
        top: 24px;
        right: 0;
        bottom: 0;
        left: 30%;
        width: 70%;
        height: calc(100% - 24px);
        object-fit: cover;
        object-position: top;
      }
      .body {
        position: relative;
        flex: 1;
        display: flex;
        flex-direction: column;
        margin-top: 0;
        padding: 18px 20px 14px;
        border-top-left-radius: 0;
        background: #fff;
      }
      h1 {
        margin: 0;
        color: var(--blue);
        font-size: 26px;
        line-height: 1.05;
        letter-spacing: -0.02em;
        text-transform: uppercase;
      }
      .nick {
        margin: 4px 0 0;
        color: var(--sky);
        font-size: 16px;
        font-weight: 600;
      }
      .meta {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 12px;
        color: #3f3f46;
        font-size: 11px;
        line-height: 1.3;
      }
      .meta div {
        border-left: 3px solid var(--sky);
        padding-left: 8px;
      }
      .meta strong {
        display: block;
        color: var(--blue);
      }
      .code {
        margin-top: auto;
        padding-top: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .code svg { display: block; width: 92px; height: 92px; }
      .digits {
        margin: 4px 0 0;
        text-align: center;
        color: #71717a;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 10px;
        letter-spacing: 0.3em;
      }
      @media print {
        body { background: #fff; }
        .card { box-shadow: none; }
      }
    </style>
  </head>
  <body>
    <article class="card">
      <div class="photo">
        <div class="brand"><span>WSC</span></div>
        <img
          src="https://erpzxusskbtdxvqadwxv.supabase.co/storage/v1/object/public/avatars/roster-68110103.jpg"
          alt="CHIT WAI PHYO"
        />
      </div>
      <div class="body">
        <h1>CHIT WAI PHYO</h1>
        <p class="nick">อาร์</p>
        <div class="meta">
          <div>
            <strong>รหัสพนักงาน :</strong>
            68110103
          </div>
          <div>
            <strong>วันที่ลงทะเบียน :</strong>
            02/05/2026
          </div>
        </div>
        <div class="code">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 23 23" shape-rendering="crispEdges" role="img" aria-label="68110103"><path fill="#ffffff" d="M0 0h23v23H0z"/><path stroke="#1e293b" d="M1 1.5h7m3 0h1m1 0h1m1 0h7M1 2.5h1m5 0h1m3 0h2m2 0h1m5 0h1M1 3.5h1m1 0h3m1 0h1m1 0h5m1 0h1m1 0h3m1 0h1M1 4.5h1m1 0h3m1 0h1m1 0h1m2 0h1m2 0h1m1 0h3m1 0h1M1 5.5h1m1 0h3m1 0h1m1 0h2m1 0h2m1 0h1m1 0h3m1 0h1M1 6.5h1m5 0h1m1 0h3m1 0h1m1 0h1m5 0h1M1 7.5h7m1 0h1m1 0h1m1 0h1m1 0h7M9 8.5h1m1 0h3M1 9.5h1m1 0h5m2 0h1m2 0h1m1 0h5M2 10.5h1m1 0h2m2 0h2m1 0h1m1 0h1m2 0h1m2 0h2M1 11.5h2m2 0h1m1 0h1m1 0h4m1 0h1m2 0h3m1 0h1M1 12.5h1m2 0h3m1 0h2m6 0h2m3 0h1M3 13.5h1m3 0h2m1 0h3m1 0h1m2 0h3m1 0h1M9 14.5h2m1 0h4m2 0h2m1 0h1M1 15.5h7m2 0h1m2 0h1m1 0h2m2 0h1M1 16.5h1m5 0h1m1 0h1m1 0h5m3 0h1m1 0h1M1 17.5h1m1 0h3m1 0h1m1 0h2m2 0h1m2 0h1m1 0h2M1 18.5h1m1 0h3m1 0h1m1 0h1m3 0h1m2 0h1M1 19.5h1m1 0h3m1 0h1m1 0h1m2 0h1m1 0h1m2 0h1m1 0h1M1 20.5h1m5 0h1m2 0h1m5 0h2m1 0h2M1 21.5h7m1 0h1m1 0h2m1 0h1m2 0h1m1 0h1"/></svg>
          <p class="digits">68110103</p>
        </div>
      </div>
    </article>
  </body>
</html>
